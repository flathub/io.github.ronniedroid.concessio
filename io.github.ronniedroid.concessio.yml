app-id: io.github.ronniedroid.concessio
runtime: org.gnome.Platform
runtime-version: '49'
sdk: org.gnome.Sdk
command: io.github.ronniedroid.concessio

finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri

cleanup:
  - /include
  - /lib/pkgconfig
  - /share/doc
  - /share/man
  - '*.a'
  - '*.la'

modules:
  - name: concessio
    buildsystem: meson
    sources:
    - type: git
      url: https://github.com/ronniedroid/concessio.git
      tag: v0.3.0
      commit: 5f51274504bb6777ede26c0e42ce04ac4e196dfb
