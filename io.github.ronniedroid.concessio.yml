app-id: io.github.ronniedroid.concessio
runtime: org.gnome.Platform
runtime-version: '49'
sdk: org.gnome.Sdk
command: io.github.ronniedroid.concessio

finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri

cleanup:
  - /include
  - /lib/pkgconfig
  - /share/doc
  - /share/man
  - '*.a'
  - '*.la'

modules:
  - name: concessio
    buildsystem: meson
    sources:
    - type: git
      url: https://github.com/ronniedroid/concessio.git
      tag: v0.2.1
      commit: 4114ce6b4a43cf6a1db263ced55cfee5c4f4469d
